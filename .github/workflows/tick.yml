name: tick
# Автономный торговый тик (paper trading): каждые ~15 мин GitHub Actions
# запускает tools\auto_trade.ps1, пересобирает дашборд и публикует Pages.
# Килл-свитч: закоммитить файл data/HALT в main - тики выходят сразу.
#
# Публикация Pages - отдельная джоба ниже (deploy), не часть tick. Инцидент 2026-08-07:
# гейт окружения github-pages завис в approval на джобе tick, а workflow-уровневая
# concurrency-группа "tick" держала весь ран целиком - следующие раны не могли даже
# начать торговый тик, пока не разрешится approval. 17.5 часов ни сделок, ни коммитов
# состояния. Правило: гейт Pages не имеет права останавливать торговлю - точно так же,
# как сторожа (live_watch.ps1, git_sync_watch.sh) не имеют права ронять тик.

on:
  schedule:
    # непопулярные минуты: на 0/15/30/45 GitHub перегружен и часто пропускает/задерживает cron
    - cron: '4,19,34,49 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    # заявки ручного закрытия обрабатывает лёгкий manual-close.yml (~1 мин);
    # полный тик на них не дёргаем - пуши только этого файла игнорируются
    paths-ignore:
      - 'data/rf/manual_close_req.json'

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  tick:
    runs-on: windows-latest
    timeout-minutes: 14
    # Группа держит только эту джобу: раны сериализуются на торговом тике (не мешают друг
    # другу коммитить/пушить состояние), но джоба deploy ниже в неё не входит и не блокируется.
    concurrency:
      group: tick
      cancel-in-progress: false
    steps:
      # v5, а не последний мажор, СОЗНАТЕЛЬНО: v5 приносит Node 24 (ради чего бамп и делался)
      # и не трогает механизм хранения токена, а на нём держится git push в шаге Commit state.
      # В v6 этот механизм переписан ("Persist creds to a separate file") - совместимость
      # заявлена, но проверить её можно только на боевом пуше. В v7 к этому добавлены ESM и
      # security-фикс для fork-PR при pull_request_target/workflow_run - таких триггеров у нас
      # нет, так что выгоды ноль. Двигаться дальше - отдельным решением, с прогоном через
      # workflow_dispatch на ветке до мержа в main.
      - uses: actions/checkout@v5

      # Внешний сторож живости боевых контуров. Стоит ПЕРВЫМ и с continue-on-error:
      # он должен отработать даже если paper-тик потом упадёт, и не имеет права уронить
      # тик сам. Смысл в том, что Actions - единственная сторона вне VPS: сторож внутри
      # тика (deploy/git_sync_watch.sh) о смерти хоста сообщить не может.
      - name: Live contours dead-man's switch
        continue-on-error: true
        shell: powershell
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          TG_CHAT_ID_FUT: ${{ secrets.TG_CHAT_ID_FUT }}
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File tools\live_watch.ps1

      - name: Probe market data endpoints
        shell: powershell
        run: |
          foreach ($h in 'api.bybit.com','api.bytick.com','open-api.bingx.com') {
            try {
              $u = if ($h -like 'open-api*') { "https://$h/openApi/swap/v2/server/time" } else { "https://$h/v5/market/time" }
              $r = Invoke-RestMethod -Uri $u -TimeoutSec 15
              Write-Host "${h}: OK"
            } catch { Write-Warning "${h}: BLOCKED ($($_.Exception.Message))" }
          }
          try {
            $r = Invoke-RestMethod -Uri 'https://iss.moex.com/iss/engines/futures/markets/forts/securities.json?iss.only=securities&securities.columns=SECID&start=0' -TimeoutSec 20
            $n = @($r.securities.data).Count
            Write-Host "iss.moex.com: OK ($n securities)"
          } catch { Write-Warning "iss.moex.com: BLOCKED ($($_.Exception.Message))" }

      - name: Run trading tick
        shell: powershell
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File tools\auto_trade.ps1 -Cloud -SkipViz

      - name: Build dashboard data
        shell: powershell
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File tools\build_vizdata.ps1 -NoDeploy

      # Артефакт Pages уходит ДО коммита состояния. Тот же принцип, что в шапке файла, только
      # в обратную сторону: если гейт Pages не имеет права останавливать торговлю, то и гонка
      # git-пушей не имеет права отменять публикацию дашборда. Содержимое report/ от коммита
      # не зависит, так что порядок здесь чисто про изоляцию отказов.
      # include-hidden-files: с v4 этот экшен молча выбрасывает скрытые файлы, а артефакт обязан
      # быть точной копией report/ - иначе состав опубликованного сайта тихо расходится с тем,
      # что собрал build_vizdata. Сейчас из dotfiles там .nojekyll и .gitignore. Флаг появился
      # только в v5, поэтому v4 не подходит.
      # ТОЧНОСТИ РАДИ (правка после аудита 2026-08-17): .nojekyll в ЭТОЙ схеме ни на что не
      # влияет - при artifact-деплое (Source = GitHub Actions, deploy-pages) Jekyll не
      # запускается вообще, отдельного шага сборки в воркфлоу нет. Файл остался со времён
      # публикации из ветки; в RESTORE.md он числится обязательным по той же исторической
      # причине. Так что аргумент здесь - целостность артефакта, а не «иначе сломается Jekyll».
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: report
          include-hidden-files: true

      # Логика жила инлайном и краснела на штатной гонке пушей (инцидент 2026-08-17, 8 красных
      # ранов за 2 часа при успешном тике) - подробности и коды возврата в шапке скрипта.
      - name: Commit state
        shell: powershell
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File tools\commit_state.ps1 -Path portfolio.json,journal.md,data -Label tick

  deploy:
    needs: tick
    runs-on: ubuntu-latest
    # Отдельная группа: только публикация Pages, торгового тика не касается. cancel-in-progress
    # тут безопасен и нужен - актуальна только последняя сборка дашборда, накопление очереди
    # ранов ожидающих approval - это и есть баг, который чинит этот сплит.
    concurrency:
      group: tick-pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
